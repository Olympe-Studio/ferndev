[test]
coverage = true
# NOTE: Bun honors plural keys here; the singular form (line/function/statement) is silently ignored.
coverageThreshold = { lines = 1, functions = 1, statements = 1 }
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coveragePathIgnorePatterns = [
  "**/dist/**",
  "**/node_modules/**",
  "**/tests/**",
  "**/*.config.*",
  "**/types.ts"
]

# Isolated installs: hoisted, ajv-draft-04 (peer ajv ^8) landed beside eslint's ajv 6 at the
# root and broke `vite build` on every fresh install (CI included).
[install]
linker = "isolated"
